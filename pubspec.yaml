name: omar_app
description: "تطبيق إدارة ديون السوق - SAMI MARKET"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database (Offline-first)
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Routing
  go_router: ^14.8.1

  # Localization
  intl: ^0.20.2

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # Utilities
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
  equatable: ^2.0.7
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.3
  pdf: ^3.13.0
  printing: ^5.15.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.23.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0a0e1a"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/images/
